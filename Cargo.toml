[workspace]
members = ["app_info"]
resolver = "2"

[workspace.package]
description = "Pitchgrid-Continuum Bridge"
license = "MIT or Apache-2.0"
version = "1.0.0"

[package]
name = "pitchgrid_continuum"
description.workspace = true
license.workspace = true
version.workspace = true
authors = ["Simon O'Rorke"]
edition = "2024"
build = "build.rs"

[lints.clippy]
# These types (singletons, strategies, test mocks) are never default-constructed; a `Default`
# delegating to `new()` would be ceremony.
new_without_default = "allow"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
app_info = { path = "app_info" }
cxx = "1.0.202"
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.34"
midir = "0.11.0"
midly = "0.5.3"
open = "5.4.4"
rayon = "1.12.0"
rosc = "0.11.4"
round = "0.1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
# Don't update slint: 1.18.0 breaks vivi_ui.
slint = "=1.17.1"
ureq = "3.4.2"
version-compare = "0.2.1"

[build-dependencies]
app_info = { path = "app_info" }
cxx-build = "1.0.202"
# Don't update slint: 1.18.0 breaks vivi_ui.
slint-build = "=1.17.1"
vivi_ui = "0.2.0"

[target.'cfg(windows)'.build-dependencies]
# Using embed-resource instead of the more popular winres
# for application icon and exe file propertieds because
# winres puts an oblique before the apostrophe in my name.
# It's a known shortcoming of winres to always 'escape' an apostrophe.
embed-resource = "3.0.8"

[dev-dependencies]
googletest = "0.14.3"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSData"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage"] }
