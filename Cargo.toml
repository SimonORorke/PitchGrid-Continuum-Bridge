[workspace]
members = [
    "app_info",
]
resolver = "2"

[workspace.package]
description = "Pitchgrid-Continuum Bridge"
license = "MIT or Apache-2.0"
version = "1.0.1"

[package]
name = "pitchgrid_continuum"
description.workspace = true
license.workspace = true
version.workspace = true
authors = ["Simon O'Rorke"]
edition = "2024"
build = "build.rs"

[lints.clippy]
# These types (singletons, strategies, test mocks) are never default-constructed; a `Default`
# delegating to `new()` would be ceremony.
new_without_default = "allow"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# simonor is a path dependency to a sibling folder that is itself a separate, nested Cargo
# workspace. `cargo check` and `cargo build` keep separate incremental/fingerprint caches,
# and `cargo check`'s cache can go stale relative to the sibling crate's actual files,
# causing RustRover (which drives its "unresolved import" diagnostics off `cargo check`)
# to show false-positive red underlines for recently added simonor items, even though
# `cargo build` compiles fine. Fix: `cargo clean -p simonor -p simonor-core -p simonor-testing`,
# then close and reopen RustRover so it re-runs `cargo check` from scratch.
simonor = { path = "../simonor" }
# Once simonor is stable, its dependency can be updated to point to its GitHub repo.
# (Point to a tag rather than a branch in due course):
# simonor = { git = "https://github.com/SimonORorke/simonor.git", branch = "main" }
app_info = { path = "app_info" }
cxx = "1.0.202"
env_logger = "0.11.11"
# Used for window attributes hook and winit monitor access across platforms.
# Must track the slint version exactly.
i-slint-backend-winit = "=1.17.1"
log = "0.4.34"
midly = "0.5.3"
open = "5.4.4"
rayon = "1.12.0"
rosc = "0.11.4"
# round really is used, in tuning_params.rs, even though, for unknown reason, it is
# itermittently shown greyed out.
round = "0.1.2"
serde = "1.0.229"
# With vivi_ui 0.2.0, slint 1.17.1 is the latest version with which there are no
# build errors or warnings.
# With vivi_ui 0.2.0 and slint 1.18.0, there are many build errors and a few build warnings.
# With slint 1.18.1, the errors no longer occur but the warnings still do.
# The warnings are:
# warning: The property 'viewport-x' has been deprecated. Please use 'content-x' instead
# warning: The property 'viewport-y' has been deprecated. Please use 'content-y' instead
# warning: The property 'viewport-height' has been deprecated. Please use 'content-height' instead
# warning: The property 'viewport-width' has been deprecated. Please use 'content-width' instead
# I've raised an issue with vivi: https://codeberg.org/vivi-ui/vivi/issues/7.
# It should be fixed now, but I'm not seeing viv_ui 0.2.1 yet.
slint = "=1.17.1"

[build-dependencies]
cxx-build = "1.0.202"
slint-build = "=1.17.1"
vivi_ui = "0.2.0"
simonor = { path = "../simonor" }
app_info = { path = "app_info" }
# Using embed-resource instead of the more popular winres
# for application icon and exe file properties because
# winres puts an oblique before the apostrophe in my name.
# It's a known shortcoming of winres to always 'escape' an apostrophe.
# Not restricted to a Windows build-dependency target because build.rs decides,
# at run time (via CARGO_CFG_TARGET_OS), whether to actually use it, in order to
# correctly reflect the target platform rather than the host building it; the
# crate itself supports being compiled on, and cross-compiling from, any host.
embed-resource = "3.0.12"

[dev-dependencies]
googletest = "0.14.3"
simonor = { path = "../simonor", features = ["testing"] }
# Once simonor is stable and pushed to remote Git, update the dependency to point
# to its Git repo:
# simonor = { git = "https://github.com/SimonORorke/simonor.git", branch = "main", features = ["testing"] }

# macOS Bundle
[package.metadata.bundle]
name = "PitchGrid-Continuum Bridge"
identifier = "com.pitchgrid.continuum"
icon = ["ui/images/Midi port black on red 512.icns"]
category = "Music"
